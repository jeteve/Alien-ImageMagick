# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test-latest:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Setup Perl environment
        uses: shogo82148/actions-setup-perl@v1.29.0
      
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libltdl-dev

      - name: Installs dependencies
        run: cpm install Alien::Base::ModuleBuild IO::Socket::SSL

      - name: Run Build.PL
        run: perl Build.PL

      - name: Run Build
        run: perl Build

  test-7_1_1-29:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Setup Perl environment
        uses: shogo82148/actions-setup-perl@v1.29.0
      
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libltdl-dev

      - name: Installs dependencies
        run: cpm install Alien::Base::ModuleBuild IO::Socket::SSL

      - name: Run Build.PL
        run: PERL_ALIEN_IMAGEMAGICK_VERSION=7.1.1-29 perl Build.PL

      - name: Run Build
        run: perl Build
